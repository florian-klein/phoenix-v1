[package]
name = "phoenix-common"
version = "0.2.1"
edition = "2021"
resolver = "2"
repository = "https://github.com/Ellipsis-Labs/phoenix-v1"
authors = ["Ellipsis Labs <maintainers@ellipsislabs.xyz>"]
description = "On-chain order book that atomically settles trades"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "lib"]
name = "phoenix"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
test = []

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[dependencies]
shank = "*" 
spl-token = { version = "*", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "*", features = [ "no-entrypoint" ] } 
solana-program = "*" 
borsh = "*" 
bytemuck = "*" 
lib-sokoban =  "*" 
num_enum = "*" 
itertools = "*" 
thiserror = "*" 
static_assertions = "*" 
